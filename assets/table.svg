<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3076" />
      <stop offset="100%" stop-color="#145d6a" />
    </linearGradient>
    <style>
      .grid { stroke: #3a3a4a; stroke-width: 1; fill: none; }
      .bg { fill: #0d1117; }
      .header-bg { fill: url(#header-grad); }
      .header-text { font-family: sans-serif; font-size: 15px; font-weight: normal; fill: #e6edf3; text-anchor: middle; }
      .row-text { font-family: sans-serif; font-size: 13px; fill: #8b949e; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="15" y="15" width="770" height="120" rx="8" />
  <rect class="header-bg" x="15" y="15" width="770" height="40" rx="8" />
  
  <!-- Cover bottom corners of header-bg -->
  <rect class="header-bg" x="15" y="35" width="770" height="20" />

  <!-- Grid lines -->
  <rect class="grid" x="15" y="15" width="770" height="120" rx="8" />
  <line class="grid" x1="15" y1="55" x2="785" y2="55" />
  <line class="grid" x1="270" y1="15" x2="270" y2="135" />
  <line class="grid" x1="530" y1="15" x2="530" y2="135" />

  <!-- Header text -->
  <text class="header-text" x="142" y="42">☕ Coffee</text>
  <text class="header-text" x="400" y="42">⏱️ Coding</text>
  <text class="header-text" x="657" y="42">💡 Fun fact</text>

  <!-- Row text -->
  <text class="row-text" x="142" y="95">Fueled by chai,</text>
  <text class="row-text" x="142" y="115">not just coffee</text>
  
  <text class="row-text" x="400" y="105">Most productive after midnight</text>
  
  <text class="row-text" x="657" y="95">Once trained a model to render</text>
  <text class="row-text" x="657" y="115">thoughts into images</text>
</svg>
