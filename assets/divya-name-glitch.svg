<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#7C4DFF;#00F5FF;#4F8CFF;#7C4DFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#7C4DFF;#4F8CFF;#00F5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C4DFF">
        <animate attributeName="stop-color" values="#7C4DFF;#4F8CFF;#00F5FF;#7C4DFF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="900" height="240"/></clipPath>
  </defs>

  <rect width="900" height="240" fill="#05070B"/>
  <rect width="900" height="240" fill="url(#auroraGlow)"/>

  <g clip-path="url(#clip)">
    <g transform="translate(450,130)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0; 0,6; 0,0" dur="6s" repeatCount="indefinite"/>

        <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#00F5FF" opacity="0.65">
          DIVYA DAVANE
          <animate attributeName="x" values="-2;-6;2;-2;-2;5;-2" keyTimes="0;0.1;0.12;0.3;0.5;0.52;1" dur="2.6s" repeatCount="indefinite"/>
        </text>

        <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#7C4DFF" opacity="0.65">
          DIVYA DAVANE
          <animate attributeName="x" values="2;6;-2;2;2;-5;2" keyTimes="0;0.1;0.12;0.3;0.5;0.52;1" dur="2.6s" repeatCount="indefinite"/>
        </text>

        <text x="0" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="url(#nameFill)" filter="url(#glow)">
          DIVYA DAVANE
        </text>
      </g>
    </g>

    <rect x="0" y="-20" width="900" height="6" fill="#ffffff" opacity="0.08">
      <animate attributeName="y" values="-20;260;-20" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="260" y="168" width="380" height="3" fill="url(#nameFill)" opacity="0.9">
      <animate attributeName="width" values="380;420;380" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x" values="260;240;260" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="4" y="4" width="892" height="232" rx="18" fill="none" stroke="url(#nameFill)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
