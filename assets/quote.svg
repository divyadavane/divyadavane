<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%">
  <defs>
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0a0a12; stroke: #7b2ff7; stroke-width: 2; filter: url(#purple-glow); rx: 8px; }
      .quote-mark { font-family: serif; font-size: 60px; font-weight: bold; fill: #00fff5; filter: url(#cyan-glow); }
      .text { font-family: sans-serif; font-size: 18px; font-style: italic; fill: #c9d1d9; }
      .author { font-family: sans-serif; font-size: 14px; fill: #7b2ff7; font-weight: bold;}
    </style>
  </defs>

  <rect class="bg" x="15" y="15" width="770" height="90" />
  
  <text class="quote-mark" x="40" y="70">"</text>
  <text class="text" x="80" y="60">The hardest part of design is keeping features out.</text>
  <text class="author" x="80" y="85">— Donald Norman</text>
</svg>
