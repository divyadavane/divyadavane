<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #3a3a4a; stroke-width: 1; rx: 8px; }
      .quote-mark { font-family: serif; font-size: 40px; font-weight: bold; fill: #009999; }
      .text { font-family: sans-serif; font-size: 16px; font-style: italic; fill: #8b949e; }
      .author { font-family: sans-serif; font-size: 13px; fill: #663399; font-weight: bold;}
    </style>
  </defs>

  <rect class="bg" x="15" y="15" width="770" height="90" />
  
  <text class="quote-mark" x="40" y="65">"</text>
  <text class="text" x="70" y="60">The hardest part of design is keeping features out.</text>
  <text class="author" x="70" y="85">— Donald Norman</text>
</svg>
