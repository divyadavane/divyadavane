<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0a0a12; stroke: #4361ee; stroke-width: 2.5; filter: url(#glow); rx: 8px; }
      .text { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; }
      .prompt { fill: #00fff5; filter: url(#glow); }
      .arrow { fill: #ff4dd8; filter: url(#glow); }
      .output { fill: #c9d1d9; }
      .cursor { fill: #00fff5; animation: blink 1s step-end infinite; filter: url(#glow); }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .circle-red { fill: #ff5f56; }
      .circle-yellow { fill: #ffbd2e; }
      .circle-green { fill: #27c93f; }
    </style>
  </defs>
  
  <rect class="bg" x="15" y="15" width="570" height="270" />
  
  <!-- Mac Window Controls -->
  <circle class="circle-red" cx="35" cy="35" r="6" />
  <circle class="circle-yellow" cx="55" cy="35" r="6" />
  <circle class="circle-green" cx="75" cy="35" r="6" />
  
  <!-- Terminal Content -->
  <text class="text" x="35" y="80">
    <tspan class="prompt">$ </tspan>
    <tspan class="output">whoami</tspan>
  </text>
  <text class="text" x="35" y="105">
    <tspan class="arrow">&gt; </tspan>
    <tspan class="output">Divya Davane</tspan>
  </text>

  <text class="text" x="35" y="145">
    <tspan class="prompt">$ </tspan>
    <tspan class="output">status --current</tspan>
  </text>
  <text class="text" x="35" y="170">
    <tspan class="arrow">&gt; </tspan>
    <tspan class="output">Building AI products</tspan>
  </text>
  <text class="text" x="35" y="195">
    <tspan class="arrow">&gt; </tspan>
    <tspan class="output">Learning Agentic AI</tspan>
  </text>
  <text class="text" x="35" y="220">
    <tspan class="arrow">&gt; </tspan>
    <tspan class="output">Exploring LangGraph</tspan>
  </text>
  <text class="text" x="35" y="245">
    <tspan class="arrow">&gt; </tspan>
    <tspan class="output">Building full stack apps</tspan>
  </text>

  <text class="text" x="35" y="275">
    <tspan class="prompt">$ </tspan>
    <tspan class="output">_</tspan>
  </text>
  <!-- Blinking Cursor -->
  <rect class="cursor" x="53" y="263" width="10" height="15" />
</svg>
