<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="100%">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .text { font-family: monospace, sans-serif; font-size: 26px; font-weight: bold; fill: #7b2ff7; filter: url(#glow); text-anchor: middle; }
    </style>
  </defs>
  <text class="text" x="300" y="40">🛸 FUN FACTS</text>
</svg>
