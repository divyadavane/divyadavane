name: Generate Snake Animation

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  
  # Allows to manually run the Job at any time
  workflow_dispatch:
  
  # Run on every push on the main branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C4DFF&color_dots=#ebedf0,#c0a0ff,#9d68ff,#7c4dff,#4f14e0
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00F5FF&color_dots=#161B22,#211D49,#4C2885,#7C4DFF,#00F5FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
